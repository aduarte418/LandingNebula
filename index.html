<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula</title>
    <!--Enlace al icono de la web en la pestaña-->
    <link rel="icon" href="assets/img/nebula-logo.svg" type="image/svg">
    <!--Enlaces a fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--Black Ops One-->
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
        rel="stylesheet">
    <!--Orbitron-->
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
    <!--Press Start 2P-->
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Orbitron:wght@400..900&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <!-- Enlace para Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!--Enlace a la hoja de estilo CSS-->
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <!-- Zona hero-->
    <!--Header para el logo y el título de la página-->
    <header>
        <!--Barra de navegación para dirigir a cada sección de recursos-->
        <nav id="navbar">
            <ul>
                <li><a href="#hero-zone">Inicio</a></li>
                <li><a href="#projects-title">Proyectos</a></li>
                <li><a href="#btn-img">Contacto</a></li>
                <!--Enlaces a los botones que reproducen vídeo y audio-->
                <li><a href="#reel">Vídeo</a></li>
                <li><a href="#btn-audio">Audio</a></li>
            </ul>

            <div id="hero-zone">
                <!--Titulo-->
                <h1 id="title">Nebula</h1>
                <!--Subtítulo-->
                <h2 id="subtitle">Artista de la galaxia</h2>
                <div id="img-hero">
                    <figure>
                        <img src="assets/img/hero-image.webp" alt="Imagen espacial estilo nebulosa como fondo de página"
                            width="100%" height="auto" loading="lazy">
                        <figcaption class="cites">
                            "Imagen espacio-galaxia-universo-nebulosa" por Alexander Saltaev, CC0 BY-NC-ND 4.0
                        </figcaption>
                    </figure>
                </div>
            </div>

    </header>

    <main>
        <!--- Nuevo logo de Nebula (SVG en el DOM)-->
        <div id="logo">
            <!--SVG con sus propiedades y círculo accesible mediante tabindex para admitir :focus-->
            <svg id="iconoNebula" tabindex="0" width="50" height="50" viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg">
                <circle id="circuloNebula" cx="50" cy="50" r="40" fill="#128aa8" />
            </svg>
        </div>

        <h1 id="projects-title">Mis proyectos</h1>

        <h2 id="galeria">Galería Dinámica</h2>

        <!--Contenedor para la Galería Dinámica-->
        <div id="img-galeria">
            <img src="assets/img/project-1.webp" alt="Imagen de Paisaje Espacial" width="800px" height="500px"
                loading="lazy">
        </div>

        <!--Contenedor para un grid con los proyectos de Nebula-->
        <div id="grid">
            <!--Cada tarjeta del grid-->
            <!--Proyecto 1-->
            <div class="project">
                <h3>Orion Nebula</h3>
                <figure>
                    <img class="photo" src="assets/img/project-1.webp" alt="Imagen de Nebula de Orión" width="400px"
                        height="250px" loading="lazy">
                    <figcaption class="cites">
                        "Imagen nebula-de-orion" por WikiImages, CC0 BY-NC-ND 4.0
                    </figcaption>
                </figure>
            </div>

            <!--Proyecto 2-->
            <div class="project">
                <h3>Rosetta Nebulae</h3>
                <figure>
                    <img class="photo" src="assets/img/project-2.webp" alt="Imagen de la nebulosa Roseta" width="400px"
                        height="250px" loading="lazy">
                    <figcaption class="cites">
                        "Imagen nebula-rosetta" por SubMeet, CC0 BY-NC-ND 4.0
                    </figcaption>
                </figure>
            </div>

            <!--Proyecto 3-->
            <div class="project">
                <h3>Floating Stardust</h3>
                <figure>
                    <img class="photo" src="assets/img/project-3.webp" alt="Imagen del polvo flotante de una nebulosa"
                        width="400px" height="250px" loading="lazy">
                    <figcaption class="cites">
                        "Imagen polvo-flotante" por Vilkasss, CC0 BY-NC-ND 4.0
                    </figcaption>
                </figure>
            </div>

            <!--Proyecto 4-->
            <div class="project">
                <h3>Sky Of A Million Stars</h3>
                <figure>
                    <img class="photo" src="assets/img/project-4.webp" alt="Silueta de una persona frente al espacio"
                        width="400px" height="250px" loading="lazy">
                    <figcaption class="cites">
                        "Imagen universo-persona-silueta-estrellas" por geralt, CC0 BY-NC-ND 4.0
                    </figcaption>
                </figure>
            </div>

        </div>

        <!--Botón de contacto con animación integrada-->
        <button class="btn" onclick="window.location.href='mailto:antondm11@gmail.com'">
            <img id="btn-img" src="assets/img/button-animation.webp" alt="Animación futurista situada en el botón"
                width="245px" height="95px" loading="lazy">
            <p class="btn-text">Contacta conmigo</p>
        </button>

        <br>
        <br>
        <br>

        <!--Botón para ver el vídeo en ventana modal (vinculado a la ventana por JS)-->
        <button id="reel" class="btn">Ver Reel de Animación</button>

        <!--Ventana modal con el vídeo integrada (oculta por defecto mediante CSS)-->
        <div id="modal" class="modal-container">
            <div class="modal-content">
                <span id="close-modal">&times;</span>
                <figure>
                    <video id="video" controls poster="assets/img/poster.webp" width="100%" height="auto">
                        <source src="assets/video/night-sky-video.mp4" type="video/mp4">
                    </video>
                    <figcaption class="cites">
                        "Vídeo cielo nocturno" por Branislav Schmogrovits, CC0 BY-NC-ND 4.0
                    </figcaption>
                </figure>
            </div>
        </div>

        <br>
        <br>
        <br>

        <!--Reproductor de audio personalizado -->
        <div id="audio-container">
            <button id="btn-audio" class="btn">Escuchar ambiente espacial</button>
            <audio id="ambient-audio" preload="metadata" loop style="display: none;">
                <source src="assets/audio/juliush-interstellar-science-fiction-sounds.mp3" type="audio/mpeg">
                Tu navegador no soporta la reproducción de audio.
            </audio>
            <figcaption class="cites">
                "Interstellar Science Fiction Sounds" por JuliusH, CC0 BY-NC-ND 4.0
            </figcaption>
        </div>
        <br>
    </main>
    <footer>
        <br>
        <p class="foot-text">© 2026 Nebula</p>
        <p class="foot-text">Obra bajo licencias CC BY-NC-SA 4.0.</p>
        <p class="foot-text"><a href="credits.html" style="color: #13bfeb;">Créditos y Atribuciones</a></p>

    </footer>
    <!--Script Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!--Script-->
    <script src="script.js"></script>
</body>

</html>
