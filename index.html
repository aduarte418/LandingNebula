<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula</title>

    <!--Enlace al icono de la web en la pestaña-->
    <link rel="icon" href="assets/img/nebula-logo.svg" type="image/svg">

    <!--Enlaces a fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--Black Ops One-->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <!--Orbitron-->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <!--Press Start 2P-->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400..900&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Orbitron:wght@400..900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!--Enlace a la hoja de estilo CSS-->
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <!-- Zona hero-->
        <!--Header para el logo y el título de la página-->
        <header>
            <div id="hero-zone">
                <!--Titulo-->
                <h1 id="title">Nébula</h1>
                <!--Subtítulo-->
                <h2 id="subtitle">Artista de la galaxia</h2>
                <div id="img-hero">
                    <figure>
                        <img src="assets/img/hero-image.webp" alt="Imagen espacial estilo nebulosa como fondo de página" width="100%" height="auto" loading="lazy">
                        <figcaption class="cites">
                            "Imagen espacio-galaxia-universo-nebulosa" por Alexander Saltaev, CC0 BY-NC-ND 4.0
                        </figcaption>
                    </figure>
                </div>
            </div>

        </header>
        
        <main>
                <!---Imagen logo-->
                <div id="logo">
                    <img src="assets/img/nebula-logo.svg" alt="Logo de la página web de Nebula" width="100px" height="auto" loading="lazy">
                </div>

            <h1 id="projects-title">Mis proyectos</h1>

            <!--Contenedor para un grid con los proyectos de Nebula-->
            <div id="grid">
                <!--Cada tarjeta del grid-->
                <!--Proyecto 1-->
                <div class="project">
                    <h3>Orion Nebula</h3>
                    <figure>
                        <img src="assets/img/project-1.webp" alt="Imagen de Nebula de Orión" width="400px" height="250px" loading="lazy">
                            <figcaption class="cites">
                                "Imagen nebula-de-orion" por WikiImages, CC0 BY-NC-ND 4.0
                            </figcaption>
                    </figure>
                </div>
                
                <!--Proyecto 2-->
                <div class="project">
                    <h3>Rosetta Nebulae</h3>
                    <figure>
                        <img src="assets/img/project-2.webp" alt="Imagen de la nebulosa Roseta" width="400px" height="250px" loading="lazy">
                        <figcaption class="cites">
                            "Imagen nebula-rosetta" por SubMeet, CC0 BY-NC-ND 4.0
                        </figcaption>
                    </figure>
                </div>

                <!--Proyecto 3-->
                <div class="project">
                    <h3>Floating Stardust</h3>
                    <figure>
                        <img src="assets/img/project-3.webp" alt="Imagen del polvo flotante de una nebulosa" width="400px" height="250px" loading="lazy">
                        <figcaption class="cites">
                            "Imagen polvo-flotante" por Vilkasss, CC0 BY-NC-ND 4.0
                        </figcaption>
                    </figure>
                </div>

                <!--Proyecto 4-->
                <div class="project">
                    <h3>Sky Of A Million Stars</h3>
                    <figure>
                        <img src="assets/img/project-4.webp" alt="Silueta de una persona frente al espacio" width="400px" height="250px" loading="lazy">
                        <figcaption class="cites">
                            "Imagen universo-persona-silueta-estrellas" por geralt, CC0 BY-NC-ND 4.0
                        </figcaption>
                    </figure>
                </div>  

            </div>

            <!--Botón de contacto con animación integrada-->
            <button class="btn" onclick="window.location.href='mailto:antondm11@gmail.com'">
                <img id="btn-img" src="assets/img/button-animation.webp" alt="Animación futurista situada en el botón" width="245px" height="95px" loading="lazy">
                <p class="btn-text">Contacta conmigo</p>
            </button>

            <br>


            <!--Vídeo-->
            <video id="video" poster="assets/img/anima-1.webp" width="800px" height="600px" controls autoplay muted loop>
        
                <source src="assets/video/night-sky-video.mp4" type="video/mp4">

            </video>

            <br>
            <!---Audio ambiente-->
            <audio id="ambient-audio" controls preload="metadata" autoplay muted loop>
                <source src="assets/audio/juliush-interstellar-science-fiction-sounds.mp3" type="audio/mpeg">
                Tu navegador no soporta la reproducción de audio.
            </audio>

            <br>

        </main>

        <footer>
            <br>
            <p class="foot-text">© 2026 Nébula</p>
            <p class="foot-text">Todos los derechos reservados</p>
        </footer>


</body>
</html>
